<div class="cabecalho">
    <h1>Usuários</h1>

    <button (click)="mostrarFormulario()"> + Novo Usuário</button>
</div>

<div class="pesquisa">
    <input type="text" placeholder="Pesquisar usuário..."
        [(ngModel)]="termoPesquisa">
</div>

@if (formularioVisivel) {
    <form (ngSubmit)="cadastrarUsuario()">

        <div>
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome"
                [(ngModel)]="novoUsuario.nome">
        </div>

        <div>
            <label for="email">Email</label>
            <input type="text" id="email" name="email"
                [(ngModel)]="novoUsuario.email">
        </div>

        <div>
            <label for="telefone">Telefone</label>
            <input type="text" id="telefone" name="telefone"
                [(ngModel)]="novoUsuario.telefone">
        </div>

        <button type="submit">        
            @if (editandoUsuario) {
                Salvar alterações
            } @else {
                Cadastrar
            }
        </button>

        <button type="button" (click)="fecharFormulario()">Cancelar</button>
    </form>
}

<p>Usuários cadastrados:</p>

<table>
    <thead>
        <tr>
            <th>Nome</th>
            <th>Email</th>
            <th>Telefone</th>
            <th>Ações</th>
        </tr>
    </thead>

    <tbody>
        @for (usuario of usuariosFiltrados(); track usuario.id) {
            <tr>
                <td>{{usuario.nome}}</td>
                <td>{{usuario.email}}</td>
                <td>{{usuario.telefone}}</td>
                <td>
                    <button class="btn-editar" (click)="editarUsuario(usuario)">Editar</button>
                    <button class="btn-excluir"(click)="excluirUsuario(usuario.id)">Excluir</button>
                </td>
            </tr>
        } @empty {
            <tr>
                <td colspan="4" class="nenhum-usuario">
                    Nenhum usuário encontrado.
                </td>
            </tr>
        }
    </tbody>
</table>
